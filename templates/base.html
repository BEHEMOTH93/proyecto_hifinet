<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIFINET ISP</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=1.3">
</head>
<body>

    <header class="navbar">
        <div class="hifinet-titles">
            <h1 style="color: white; margin: 0; font-size: 24px;">HIFINET ISP</h1>
            <small style="color: #8c9eff;">CONECTIVIDAD TOTAL</small>
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('index') }}">Inicio</a>
            <a href="{{ url_for('about') }}">Nosotros</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('listar_productos') }}">Inventario</a>
                <a href="{{ url_for('logout') }}" style="color: #ff8a80;">Salir</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
            {% endif %}
        </nav>
    </header>

    <div class="container mt-5">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 Hifinet - Tena, Ecuador</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
