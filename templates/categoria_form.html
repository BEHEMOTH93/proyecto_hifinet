{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto; padding: 25px; border: 1px solid #ddd; border-radius: 12px; background: #fff; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h3 style="color: #333;">Nueva Categoría Relacional</h3>
    <p style="color: #666; font-size: 0.9em;">Esto se guardará en la tabla <b>categorias</b> de MySQL.</p>
    <hr>
    <form method="POST">
        <div style="margin: 20px 0;">
            <label style="display: block; text-align: left; font-weight: bold; margin-bottom: 5px;">Nombre:</label>
            <input type="text" name="nombre_categoria" placeholder="Ej: Antenas, Racks, Fibra" 
                   style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;" required>
        </div>
        <button type="submit" style="background-color: #0d6efd; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer;">
            Guardar en Base de Datos
        </button>
    </form>
    <br>
    <a href="{{ url_for('agregar') }}" style="color: #666; text-decoration: none; font-size: 0.9em;">⬅ Volver al equipo</a>
</div>
{% endblock %}
