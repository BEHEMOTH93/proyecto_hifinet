{% extends "base.html" %}
{% block content %}
<div style="margin-top: 20px; max-width: 500px;">
    <h2> Agregar Equipo a Hifinet</h2>
    <hr>
    <form action="{{ url_for('agregar') }}" method="POST">
    <div style="margin-bottom: 15px;">
        <label>Nombre del Equipo:</label><br>
        <input type="text" name="txt_nombre" style="width: 100%; padding: 8px;" required>
    </div>

    <div style="margin-bottom: 15px;">
        <label>Descripción / Detalles:</label><br>
        <textarea name="txt_descripcion" style="width: 100%; padding: 8px; height: 80px;" placeholder="Ej: Router de borde para el nodo norte"></textarea>
    </div>

    <div style="margin-bottom: 15px;">
        <label>Precio ($):</label><br>
        <input type="number" step="0.01" name="txt_precio" style="width: 100%; padding: 8px;" required>
    </div>

    <div style="margin-bottom: 20px;">
        <label>Stock (Cantidad):</label><br>
        <input type="number" name="txt_stock" style="width: 100%; padding: 8px;" required>
    </div>

    <button type="submit" style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
        Guardar Equipo
    </button>
</form>
</div>
{% endblock %}
